[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "circuit-ci"
version = "0.0.1"
description = "Circuit-CI: experimental circuit linting and evidence-driven engineering checks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mike Hamilton" }]
license = "MIT"
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
]

[project.scripts]
cci = "circuit_ci.cli.app:main"
circuitci = "circuit_ci.cli.app:main"

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "mypy>=1.11,<2",
  "prek>=0.2,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-randomly>=3.15,<5",
  "ruff>=0.8,<1",
  "types-PyYAML>=6",
  "zensical==0.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["circuit_ci"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["circuit_ci"]

[tool.coverage.report]
fail_under = 85
show_missing = true
