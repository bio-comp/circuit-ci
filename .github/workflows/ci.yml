name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: quality-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # Pin every uv invocation in this job, not merely the initial sync.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Resolve locked environment
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Assert effective Python interpreter
        run: uv run --locked python scripts/assert-python-version.py ${{ matrix.python-version }}
      - name: Verify lock freshness
        run: uv lock --check
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy circuit_ci
      - name: Test and branch coverage
        run: uv run --locked pytest --randomly-seed=42 --cov=circuit_ci --cov-branch --cov-report=term-missing
      - name: Verify CLI entrypoints
        run: |
          uv run --locked cci --help
          uv run --locked circuitci --help
      - name: Build
        run: uv build --python ${{ matrix.python-version }}
