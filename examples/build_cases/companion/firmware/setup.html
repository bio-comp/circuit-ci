<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAN Lantern · USB setup</title>
<style>
body{max-width:33rem;margin:8vh auto;padding:1.5rem;background:#102029;color:#f3f6e9;font:1.05rem system-ui}
h1{font:2.8rem Georgia,serif}label,input,button{display:block;margin:.65rem 0}
input,button{font:inherit;padding:.7rem;border:1px solid #8acdb8;border-radius:.25rem}input{width:94%;background:#18323c;color:white}
button{cursor:pointer;background:#9dd8c8;color:#102029}#status{min-height:2.5em}
</style>
<h1>LAN Lantern</h1>
<p>USB setup for a 2.4 GHz WPA personal network. Disconnect the PoE harness and use a USB data cable.</p>
<label for="ssid">Wi-Fi name</label><input id="ssid" maxlength="32" autocomplete="off">
<label for="key">Wi-Fi password</label><input id="key" type="password" minlength="8" maxlength="63" autocomplete="off">
<button id="join">Save Wi-Fi on the display</button>
<button id="ethernet">Use Ethernet</button>
<button id="forget">Erase saved Wi-Fi</button>
<p id="status" role="status"></p>
<script>
const field = id => document.getElementById(id);
const enc = new TextEncoder();
async function run(mode) {
 const buttons = [...document.querySelectorAll("button")];
 const status = field("status"), network = field("ssid").value, key = field("key").value;
 if (!navigator.serial) { status.textContent = "Use a Chromium desktop browser on localhost."; return; }
 if (mode==="wifi" && (!network || enc.encode(network).length>32 || enc.encode(key).length<8 ||
     enc.encode(key).length>63 || /[\r\n\0]/.test(network+key))) {
   status.textContent="Check the Wi-Fi name (1–32 bytes) and password (8–63 bytes)."; return;
 }
 buttons.forEach(b=>b.disabled=true);
 let port, rd, wr, timer;
 try {
   port=await navigator.serial.requestPort(); await port.open({baudRate:115200});
   rd=port.readable.getReader(); wr=port.writable.getWriter();
   const decoder=new TextDecoder(); let buffer="";
   async function send(line, expected) {
     await wr.write(enc.encode(line+"\n"));
     let expired=false;
     timer=setTimeout(()=>{ expired=true; rd.cancel().catch(()=>{}); },5000);
     try {
       while(true) {
         let pos;
         while((pos=buffer.indexOf("\n"))>=0) {
           const reply=buffer.slice(0,pos).trim(); buffer=buffer.slice(pos+1);
           if(reply===expected)return;
           if(reply.startsWith("ERR"))throw Error("The device rejected this setting.");
         }
         const chunk=await rd.read();
         if(chunk.done)throw Error(expired?"Device did not confirm. Check the port and firmware.":"Disconnected.");
         buffer+=decoder.decode(chunk.value,{stream:true});
         if(buffer.length>4096)throw Error("Unexpected serial response.");
       }
     } finally { clearTimeout(timer); }
   }
   await new Promise(resolve=>setTimeout(resolve,1100));
   if(mode==="wifi"){
     await send("wifi","SSID"); await send(network,"KEY"); await send(key,"SAVED");
     status.textContent="Settings saved. Check the display for association and an IP address.";
   } else {
     await send(mode,mode==="wired"?"WIRED":"FORGOTTEN");
     status.textContent=mode==="wired"?"Ethernet selected. Unplug USB before reconnecting PoE.":"Saved Wi-Fi removed.";
   }
 } catch(e){ status.textContent=e.message; }
 finally {
   field("key").value=""; clearTimeout(timer);
   if(rd){try{ await rd.cancel(); }catch{} rd.releaseLock();}
   if(wr)wr.releaseLock();
   if(port){try{await port.close();}catch{}}
   buttons.forEach(b=>b.disabled=false);
 }
}
field("join").onclick=()=>run("wifi");
field("ethernet").onclick=()=>run("wired");
field("forget").onclick=()=>run("forget");
</script>
</html>
